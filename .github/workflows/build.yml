name: Build PeaceROM

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        target: [r9s]

    steps:
      - name: Check network speed
        id: speedtest
        run: |
          sudo apt-get update -y
          sudo apt-get install -y speedtest-cli curl jq
          SPEED=$(speedtest-cli --secure --simple | grep 'Download' | awk '{print int($2)}')
          echo "Download speed: $SPEED Mbps"
          echo "speed=$SPEED" >> $GITHUB_OUTPUT
          if [ "$SPEED" -lt 1500 ]; then
            echo "Speed too low! ($SPEED Mbps, need ~1500 Mbps for 200 MB/s) Retrying..."
            curl -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              https://api.github.com/repos/${{ github.repository }}/actions/workflows/build.yml/dispatches \
              -d "{\"ref\":\"${{ github.ref_name }}\"}"
            exit 1
          fi
          
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Free disk space (Fast)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      # REMOVED: jlumbroso/free-disk-space (Too slow)

      - name: Free disk space (Aggressive)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            jq attr ccache clang ffmpeg golang \
            libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp \
            curl xxd patchelf flex bison libarchive-tools build-essential pcre2-utils
          sudo modprobe erofs f2fs
          
          # Fix permissions
          chmod -R +x scripts/
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Build dependencies
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/build_dependencies.sh

      # PARALLEL DOWNLOADS
      # We run both download scripts in the background using '&' and wait for both to finish.
      - name: Download Firmware (Parallel)
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          echo "Starting Source Download..."
          ./scripts/download_fw.sh --force --ignore-target &
          PID_SRC=$!
          
          echo "Starting Target Download..."
          ./scripts/download_fw.sh --force --ignore-source &
          PID_TGT=$!
          
          wait $PID_SRC
          wait $PID_TGT
          echo "Both downloads finished."

      # PARALLEL EXTRACTION
      - name: Extract Firmware (Parallel)
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          echo "Starting Source Extraction..."
          ./scripts/extract_fw.sh --force --ignore-target &
          PID_SRC=$!
          
          echo "Starting Target Extraction..."
          ./scripts/extract_fw.sh --force --ignore-source &
          PID_TGT=$!
          
          wait $PID_SRC
          wait $PID_TGT
          echo "Both extractions finished."

      - name: Build ROM
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/make_rom.sh --force

      - name: Upload to GoFile
        run: |
          ZIP_FILE=$(find out -maxdepth 1 -type f -name "*.zip" | head -n 1)

          RESPONSE=$(curl -s -F "file=@$ZIP_FILE" -F "token=${{ secrets.GOFILE_TOKEN }}" -F "folderId=${{ secrets.GOFILE_FOLDER_ID }}" "https://upload-eu-par.gofile.io/uploadFile")

          echo "Uploaded successfully! Download link:"
          echo "$RESPONSE" | jq -r '.data.downloadPage'

          echo "MD5:"
          md5sum "$ZIP_FILE"

          echo "SHA256:"
          sha256sum "$ZIP_FILE"
