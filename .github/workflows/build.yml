name: Build PeaceROM

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        target: [r9s]

    steps:
      - name: Check network speed (Fast)
        id: speedtest
        run: |
          echo "Testing download speed..."
          SPEED_BPS=$(curl -s -w "%{speed_download}" -o /dev/null http://speedtest.tele2.net/100MB.zip)
          SPEED_MBPS=$(echo "$SPEED_BPS / 125000" | bc)
          echo "Download speed: $SPEED_MBPS Mbps"
          
          if [ "$SPEED_MBPS" -lt 50 ]; then
            echo "Speed too low! ($SPEED_MBPS Mbps). Retrying..."
            curl -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              https://api.github.com/repos/${{ github.repository }}/actions/workflows/build.yml/dispatches \
              -d "{\"ref\":\"${{ github.ref_name }}\"}"
            exit 1
          fi

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Checkout Submodules (Parallel)
        run: |
          git submodule update --init --recursive --depth 1 --jobs 8

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # --- SCORCHED EARTH DISK CLEANUP (Max Space for 85GB+) ---
      - name: Maximize Disk Space
        run: |
          # Delete huge pre-installed packages
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          
          # Delete extra languages/tools
          sudo rm -rf /usr/share/swift /usr/share/java /usr/local/share/powershell /usr/lib/google-cloud-sdk
          
          # Docker cleanup
          sudo docker image prune --all --force
          sudo docker builder prune -a --force
          
          echo "Disk cleaned. Available Space:"
          df -h
      
      - name: Free disk space (Fast)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a --force

      - name: Free disk space (Aggressive)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'
          

      - name: Cache Build Tools
        id: tool-cache
        uses: actions/cache@v4
        with:
          path: |
            tools/
            ~/.ccache
          key: ${{ runner.os }}-build-tools-${{ hashFiles('scripts/build_dependencies.sh') }}

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            jq attr ccache clang ffmpeg golang \
            libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp \
            curl xxd patchelf flex bison libarchive-tools build-essential pcre2-utils
          sudo modprobe erofs f2fs
          
          chmod -R +x scripts/
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build dependencies
        if: steps.tool-cache.outputs.cache-hit != 'true'
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          ./scripts/build_dependencies.sh

      - name: Download Firmware (Parallel)
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          echo "Starting Source Download..."
          ./scripts/download_fw.sh --force --ignore-target &
          PID_SRC=$!
          
          echo "Starting Target Download..."
          ./scripts/download_fw.sh --force --ignore-source &
          PID_TGT=$!
          
          wait $PID_SRC
          wait $PID_TGT
          echo "Both downloads finished."

      - name: Extract Firmware (Sequential)
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          
          echo "Extracting Source..."
          ./scripts/extract_fw.sh --force --ignore-target
          
          echo "Extracting Target..."
          ./scripts/extract_fw.sh --force --ignore-source

      - name: Build ROM
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/make_rom.sh --force

      - name: Upload to GoFile
        run: |
          ZIP_FILE=$(find out -maxdepth 1 -type f -name "*.zip" | head -n 1)

          RESPONSE=$(curl -s -F "file=@$ZIP_FILE" -F "token=${{ secrets.GOFILE_TOKEN }}" -F "folderId=${{ secrets.GOFILE_FOLDER_ID }}" "https://upload-eu-par.gofile.io/uploadFile")

          echo "Uploaded successfully! Download link:"
          echo "$RESPONSE" | jq -r '.data.downloadPage'

          echo "MD5:"
          md5sum "$ZIP_FILE"

          echo "SHA256:"
          sha256sum "$ZIP_FILE"
